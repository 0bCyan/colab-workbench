services:
  workbench:
    image: colab-workbench:${WORKBENCH_IMAGE_TAG:-local}
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WORKBENCH_PORT:-8765}:8765"
    volumes:
      - ./runtime:/var/lib/workbench
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 8m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
