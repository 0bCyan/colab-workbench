services:
  workbench:
    environment:
      WORKBENCH_AUTH_REQUIRED: "true"
      WORKBENCH_ALLOWED_HOSTS: "${WORKBENCH_DOMAIN:?Set WORKBENCH_DOMAIN},${WORKBENCH_WWW_DOMAIN:?Set WORKBENCH_WWW_DOMAIN}"
    # Only Caddy and trusted loopback/SSH clients can reach this private backend.
    command: ["uvicorn", "backend.app:app", "--host", "0.0.0.0", "--port", "8765", "--timeout-graceful-shutdown", "420", "--no-access-log", "--proxy-headers", "--forwarded-allow-ips=*"]
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      WORKBENCH_DOMAIN: ${WORKBENCH_DOMAIN:?Set WORKBENCH_DOMAIN}
      WORKBENCH_WWW_DOMAIN: ${WORKBENCH_WWW_DOMAIN:?Set WORKBENCH_WWW_DOMAIN}
    volumes:
      - ./container/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./runtime/caddy/data:/data
      - ./runtime/caddy/config:/config
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
